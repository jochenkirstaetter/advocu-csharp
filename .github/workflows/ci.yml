name: CI/CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check-out latest sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --system core.longpaths true

      - name: Restore dependencies
        run: |
          dotnet restore Advocu.slnx
          dotnet restore Advocu.Mcp.slnx

      - name: Build
        run: |
          dotnet build Advocu.slnx --configuration Release --no-restore
          dotnet build Advocu.Mcp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Advocu.slnx --configuration Release --no-build --verbosity normal

  release:
    name: Pack and deploy (ubuntu only)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check-out latest sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD)) is not reachable from origin/main. Refusing to publish."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Get previous tag
        id: previous_tag
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | awk 'NR==2 {print $0}')
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREVIOUS_TAG:-none}"

      - name: Restore dependencies
        run: dotnet restore Advocu.slnx

      - name: Build
        run: dotnet build Advocu.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Advocu.slnx --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: dotnet pack src/Advocu.Core/Advocu.Core.csproj --configuration Release --no-build --output nupkgs -p:Version="$VERSION"

      - name: NuGet Trusted Publishing
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: nupkgs/*.nupkg

      - name: Push to GitHub Packages
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/${REPO_OWNER}/index.json" --api-key "$GPR_TOKEN" --skip-duplicate

      - name: Generate changelog
        env:
          PREVIOUS_TAG: ${{ steps.previous_tag.outputs.PREVIOUS_TAG }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## What's changed"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "### Commits since $PREVIOUS_TAG"
              echo ""
              git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)"
              echo ""
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${REF_NAME}"
            else
              echo "- Initial release"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: ./release-notes.md
          files: ./nupkgs/*.nupkg
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
