name: 📜 License Header Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  check-license:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check License Headers
        run: |
          if [ ! -f .github/license_header.txt ]; then
            echo "::error::Missing .github/license_header.txt"
            exit 1
          fi

          missing=0
          while IFS= read -r -d '' file; do
            if ! head -n 20 "$file" | grep -q "Licensed under the Apache License, Version 2.0"; then
              echo "::warning file=${file}::Missing Apache-2.0 license header."
              missing=$((missing + 1))
            fi
          done < <(find src -name '*.cs' -not -path '*/bin/*' -not -path '*/obj/*' -print0)

          if [ "$missing" -gt 0 ]; then
            echo "Found $missing C# file(s) without an Apache-2.0 license header."
          else
            echo "All C# files contain the Apache-2.0 license header."
          fi
